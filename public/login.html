<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • LinkNest</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth.js"></script>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f5f5;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:12px;
            width:350px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            cursor:pointer;
        }

        #message{
            margin-top:15px;
            color:red;
        }
    </style>
</head>

<body>

<div class="card">

<h2>LinkNest Login</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>

<button id="signupBtn" style="margin-top:10px;">
Create Account
</button>

<p id="message"></p>

</div>

<script src="/login.js"></script>

</body>
</html>
